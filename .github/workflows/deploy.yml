name: Deploy Next.js (estático) a S3 para ELB + Auto Scaling

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build con assetPrefix hacia S3
        run: npm run build
        env:
          ASSET_PREFIX: https://${{ secrets.S3_BUCKET }}.s3.us-east-1.amazonaws.com

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Primero los estáticos con hash (caché larga), igual que en el taller de S3
      - name: Subir estáticos (_next) a S3
        run: |
          aws s3 sync ./out/_next s3://${{ secrets.S3_BUCKET }}/_next \
            --cache-control "public,max-age=31536000,immutable"

      # Después el HTML y el resto del sitio (incluye health.html).
      # Las instancias del Auto Scaling Group descargan este contenido al arrancar.
      - name: Subir HTML y el resto del sitio a S3
        run: |
          aws s3 sync ./out s3://${{ secrets.S3_BUCKET }} \
            --exclude '_next/*' --cache-control "no-cache"
