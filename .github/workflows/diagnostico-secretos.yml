name: Diagnostico secretos AWS (temporal)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar formato (no muestra los valores)
        env:
          AK: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SK: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ST: ${{ secrets.AWS_SESSION_TOKEN }}
          BK: ${{ secrets.S3_BUCKET }}
        run: |
          check() {
            local name="$1" val="$2" prefix="$3"
            local ws="no"; [[ "$val" =~ [[:space:]] ]] && ws="SI"
            local eq="no"; [[ "$val" == *"="* ]] && eq="SI"
            local px="no"; [[ -n "$prefix" && "$val" == "$prefix"* ]] && px="si"
            local lw="no"; [[ "$val" == aws_* || "$val" == *"aws_"* ]] && lw="SI"
            echo "$name -> largo=${#val} | empieza_bien=$px | espacios_o_saltos=$ws | contiene_igual=$eq | contiene_texto_aws_=$lw"
          }
          check AWS_ACCESS_KEY_ID "$AK" "ASIA"
          check AWS_SECRET_ACCESS_KEY "$SK" ""
          check AWS_SESSION_TOKEN "$ST" "IQoJb3JpZ2lu"
          check S3_BUCKET "$BK" "todo-estaticos"
          echo "Esperado: ACCESS_KEY largo=20 empieza_bien=si; SECRET largo=40; TOKEN largo>300 empieza_bien=si; ninguno con espacios, '=' ni 'aws_'."
